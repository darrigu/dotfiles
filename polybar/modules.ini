[module/volume]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>

format-muted = <label-muted>
format-muted-prefix = 婢
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.red}

label-volume = %percentage%%
label-muted = " Mute"
label-muted-foreground = ${colors.alt_foreground}

ramp-volume-0 = 奄
ramp-volume-1 = 奄
ramp-volume-2 = 奄
ramp-volume-3 = 奔
ramp-volume-4 = 奔
ramp-volume-5 = 奔
ramp-volume-6 = 墳
ramp-volume-7 = 墳
ramp-volume-8 = 墳
ramp-volume-9 = 墳
ramp-volume-font = 2
ramp-volume-foreground = ${colors.blue}

ramp-headphones-0 = 
ramp-headphones-1 = 

[module/btna]
type = custom/text

content = " NA"
content-prefix = 
content-prefix-font = 2
content-prefix-foreground = ${colors.red}
content-padding = 0

[module/bna]
type = custom/text

content = " NA"
content-prefix = 
content-prefix-font = 2
content-prefix-foreground = ${colors.red}
content-padding = 0

[module/brightness]
type = internal/backlight

card = ${system.sys_graphics_card}

poll-interval = 0
enable-scroll = true
scroll-interval = 5

format = <ramp> <label>

label = %percentage%%

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-5 = 
ramp-6 = 
ramp-7 = 
ramp-8 = 
ramp-9 = 
ramp-font = 2
ramp-foreground = ${colors.magenta}

[module/battery]
type = internal/battery

full-at = 99

battery = ${system.sys_battery}
adapter = ${system.sys_adapter}

poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-charging-prefix = 

format-discharging = <ramp-capacity> <label-discharging>

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.red}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 2
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false

enable-click = true
enable-scroll = true
reverse-scroll = true

fuzzy-match = true

ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-default = 

format = <label-state>
format-font = 2

label-monitor = %name%

label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.green}
label-occupied-background = ${colors.background}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.background}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.foreground}
label-empty-padding = 1

label-separator = "∙"
label-separator-font = 4
label-separator-padding = 0
label-separator-foreground = ${colors.alt_background}

[module/mod]
type = internal/bspwm

format = <label-mode>
format-background = ${colors.yellow}
format-foreground = ${colors.background}
format-padding = 1

label-monocle = "Monocle"
label-tiled = "Tiled"

label-floating = ", Float"
label-pseudotiled = ", Pseudo"
label-fullscreen = ", Full"

label-locked = " | Locked"
label-sticky = " | Sticky"
label-private = " | Private"

[module/date]
type = internal/date

interval = 1.0

time = %H:%M
time-alt = %a, %d %b %Y

format = <label>
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.red}

label = %time%
label-font = 3

[module/mpd]
type = internal/mpd

interval = 2

format-online = <label-song> <icon-prev> <toggle> <icon-next>
format-online-prefix = "󰎈 "
format-online-prefix-foreground = ${colors.green}

format-playing = ${self.format-online}
format-paused = <label-song> <toggle>

format-offline = <label-offline>
format-offline-prefix = " "
format-offline-prefix-foreground = ${colors.red}
label-offline = "Offline"

label-song =  "%title% | %artist%"
label-song-maxlen = 40
label-song-ellipsis = true

icon-play = 
icon-play-font = 2
icon-play-foreground = ${colors.green}
icon-pause = 
icon-pause-font = 2
icon-pause-foreground = ${colors.yellow}
icon-stop = 
icon-stop-foreground = ${colors.red}
icon-prev = 玲
icon-prev-font = 2
icon-prev-foreground = ${colors.cyan}
icon-next = 怜
icon-next-font = 2
icon-next-foreground = ${colors.cyan}

[module/ethernet]
type = internal/network
interface = ${system.sys_network_interface}

interval = 1.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-prefix = "󰑩 "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.cyan}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󱖣 "
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${colors.red}
format-disconnected-foreground = ${colors.alt_foreground}

label-connected = "%{A1:networkmanager_dmenu &:}%downspeed% | %upspeed%%{A}"
label-disconnected = "%{A1:networkmanager_dmenu &:}Offline%{A}"

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 1.0

accumulate-stats = true
unknown-as-up = true

format-connected = <ramp-signal> <label-connected>

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${colors.red}
format-disconnected-foreground = ${colors.alt_foreground}

label-connected = "%{A1:networkmanager_dmenu &:}%essid%%{A}"
label-disconnected = "%{A1:networkmanager_dmenu &:}Disconnected%{A}"

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-font = 2
ramp-signal-foreground = ${colors.cyan}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 1
tail = true
format = <label>
format-padding = 0
label = %output%
click-left = ~/.config/bspwm/scripts/rofi_bluetooth &

[module/tray]
type = internal/tray

format = <tray>
format-padding = 8px
format-background = ${colors.alt_background}
tray-background = ${colors.alt_background}
tray-foreground = ${colors.foreground}
tray-spacing = 8px
tray-padding = 0px
tray-size = 65%

[module/sep]
type = custom/text
content = ◆
content-font = 4

content-background = ${colors.background}
content-foreground = ${colors.alt_background}
content-padding = 4
