[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ./colors.ini
include-file = ./modules.ini

[system]
sys_adapter = ACAD
sys_battery = BAT0
sys_graphics_card = intel_backlight
sys_network_interface = wlp3s0

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 24
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.foreground}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${colors.accent}

border-size = 4
border-color = ${colors.background}

padding = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "Iosevka:size=10;3"
font-1 = "Symbols Nerd Font:size=12;3"
font-2 = "Iosevka:style=bold:size=12;4"
font-3 = "Iosevka:size=6;3"

modules-left = mod sep bspwm
modules-center = mpd
modules-right = volume sep brightness sep bluetooth sep network sep battery sep date sep tray

separator =
spacing = 0

dim-value = 1.0

wm-name = bspwm
locale = 

wm-restack = bspwm

enable-ipc = true

scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local

[settings]
throttle-output = 5
throttle-output-for = 10
throttle-input-for = 30

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
